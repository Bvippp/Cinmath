async function tmdbFetch(endpoint, params={}){
  const url = new URL(TMDB_BASE + endpoint);
  url.searchParams.set('api_key', TMDB_API_KEY);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    return await res.json();
  }catch(e){console.warn('TMDB fail',endpoint,e);return null;}
}function cardHTML(m){
  const poster = m.poster || (m.poster_path ? TMDB_IMG + m.poster_path : 'https://via.placeholder.com/178x268/171311/f5eee6?text=' + encodeURIComponent((m.title||'Movie').substring(0,12)));
  const rating = m.rating || m.vote_average?.toFixed(1) || '7.5';

}

async function fetchTrending(){
  const data = await tmdbFetch('/trending/movie/week',{page:1});
  if(data && data.results){
    const movies = data.results.slice(0,20).map(r=>({id:r.id,tmdbId:r.id,title:r.title,year:r.release_date?parseInt(r.release_date.substring(0,4)):2024,rating:r.vote_average?.toFixed(1)||'7.5',genres:['Trending'],desc:r.overview,poster:r.poster_path?TMDB_IMG+r.poster_path:'',backdrop:r.backdrop_path?TMDB_BACKDROP+r.backdrop_path:'',yt:null,arch:null,isArchive:false,popularity:r.popularity}));
    document.getElementById('trendingTrack').innerHTML = movies.map(cardHTML).join('');
    document.getElementById('trendingCount').textContent = movies.length+' • real • T=0.35*log(pop)+...';
    if(movies[0]){
      const h=movies[0];
      document.getElementById('heroBg').src=h.backdrop||h.poster;
      document.getElementById('heroTitle').textContent=h.title;
      document.getElementById('heroDesc').textContent=h.desc;
      document.getElementById('heroRating').textContent='★ '+h.rating;
      document.getElementById('heroYear').textContent=h.year;
      document.getElementById('heroCount').textContent=movies.length+' trending • millions available';
      document.getElementById('hero').onclick=()=>openMovie(h.id);
      document.getElementById('heroPlay').onclick=(e)=>{e.stopPropagation();openMovie(h.id);};
      allCache=[...movies,...allCache];
    }
    return movies;
  }else{
    document.getElementById('trendingTrack').innerHTML=FALLBACK.slice(0,5).map(cardHTML).join('');

}

  if(!m){
    const data=await tmdbFetch(`/movie/${id}`);
    if(data){m={id:data.id,tmdbId:data.id,title:data.title,year:data.release_date?parseInt(data.release_date.substring(0,4)):2024,rating:data.vote_average?.toFixed(1)||'7.5',genres:data.genres?.map(g=>g.name)||['Movie'],desc:data.overview,poster:data.poster_path?TMDB_IMG+data.poster_path:'',backdrop:data.backdrop_path?TMDB_BACKDROP+data.backdrop_path:'',yt:null,arch:null,isArchive:false};}
    else{m=FALLBACK.find(x=>String(x.id)===String(id))||FALLBACK[0];}
  }
  document.getElementById('detailTitle').textContent=m.title;
  document.getElementById('detailTopTitle').textContent=m.title;
  document.getElementById('detailMeta').innerHTML=`<span class="pill white">★ ${m.rating}</span><span class="pill">${m.year}</span><span class="pill gold">${(m.genres||['Movie']).join(' • ')}</span><span class="pill">${m.isArchive?'FULL FILM LEGAL':'Trailer HD'}</span>`;
  document.getElementById('detailDesc').textContent=m.desc||'No description';
  document.getElementById('detailDetails').innerHTML=`<div style="display:flex;justify-content:space-between"><span>Year</span><span style="color:#f5eee6">${m.year}</span></div><div style="display:flex;justify-content:space-between"><span>Rating</span><span style="color:#f5eee6">★ ${m.rating}</span></div><div style="display:flex;justify-content:space-between"><span>TMDB ID</span><span style="color:#c8a87a">${m.tmdbId||m.id}</span></div><div style="display:flex;justify-content:space-between"><span>Source</span><span style="color:#22c55e">${m.isArchive?'Archive.org '+m.arch+' • FULL':'TMDB /videos • YouTube trailer legal'}</span></div>`;
  const similar=allCache.filter(x=>String(x.id)!==String(id)).slice(0,6);
  document.getElementById('similar').innerHTML=similar.map(cardHTML).join('');
  document.getElementById('detail').classList.add('open');
  const bar=document.getElementById('serverBar');
  if(m.isArchive){
    bar.innerHTML=`<button class="srv active" id="srv-archive" onclick="setServer('${m.id}','archive')">Server 1 • FULL FILM • ${m.arch} • Legal • Plays Full Movie</button>`;
    setServer(m.id,'archive');
  }else{
    bar.innerHTML=`<button class="srv active" id="srv-youtube">Server 1 • Loading trailer via TMDB /videos...</button>`;
    (async()=>{
      let ytId=m.yt;
      if(m.tmdbId){
        const vData=await tmdbFetch(`/movie/${m.tmdbId}/videos`);
        if(vData&&vData.results&&vData.results.length){
          const tr=vData.results.find(v=>v.type==='Trailer'&&v.site==='YouTube')||vData.results.find(v=>v.site==='YouTube')||vData.results[0];
          if(tr)ytId=tr.key;
        }
      }
      if(!ytId){const fb={603:'vKQi3bBA1y8',155:'EXeTwQWrcwY',27205:'YoHD9XEInc0',157336:'zSWdZVtXT7E',550:'qtRKdVHc-cE'};ytId=fb[m.tmdbId]||'dQw4w9WgXcQ';}
      m.yt=ytId;
      bar.innerHTML=`<button class="srv active" id="srv-youtube" onclick="setServer('${m.id}','youtube')">Server 1 • Official Trailer • ${ytId} • HD • Real</button>`;
      setServer(m.id,'youtube');
    })();
  }
}

function setServer(id,type){
  let m=allCache.find(x=>String(x.id)===String(id))||FALLBACK.find(x=>String(x.id)===String(id));
  if(!m)return;
  document.querySelectorAll('.srv').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('srv-'+type);if(btn)btn.classList.add('active');
  const w=document.getElementById('playerWrap');
  if(type==='archive'&&m.arch){w.innerHTML=`<iframe src="https://archive.org/embed/${m.arch}" loading="lazy" frameborder="0" allowfullscreen></iframe>`;}
  else{const yt=m.yt||'dQw4w9WgXcQ';w.innerHTML=`<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1&rel=0&modestbranding=1&playsinline=1" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe>`;}
}
function closeDetail(){document.getElementById('detail').classList.remove('open');document.getElementById('playerWrap').innerHTML='';}

// FIXED SEARCH - debounced + local fallback
let searchTimeout=null;
document.getElementById('q').addEventListener('input', (e)=>{
  const q=e.target.value.toLowerCase().trim();
  clearTimeout(searchTimeout);
  searchTimeout=setTimeout(async()=>{
    if(!q){document.getElementById('allGrid').innerHTML=allCache.slice(0,60).map(cardHTML).join('');return;}
    const local=allCache.filter(m=>m.title.toLowerCase().includes(q));
    if(local.length>=3){document.getElementById('allGrid').innerHTML=local.slice(0,60).map(cardHTML).join('');toast(`Search "${q}" • ${local.length} local results`);return;}
    const data=await tmdbFetch('/search/movie',{query:q,page:1});
    if(data&&data.results){
      const movies=data.results.map(r=>({id:r.id,tmdbId:r.id,title:r.title,year:r.release_date?parseInt(r.release_date.substring(0,4)):2024,rating:r.vote_average?.toFixed(1)||'7.5',genres:['Search'],desc:r.overview,poster:r.poster_path?TMDB_IMG+r.poster_path:'',backdrop:r.backdrop_path?TMDB_BACKDROP+r.backdrop_path:'',yt:null,arch:null,isArchive:false}));
      document.getElementById('allGrid').innerHTML=movies.map(cardHTML).join('')||`<div style="padding:40px;color:#8a7d73">No results for ${q}</div>`;
      toast(`Search "${q}" • ${movies.length} real results from TMDB millions`);
    }else{
      document.getElementById('allGrid').innerHTML=local.map(cardHTML).join('')||`<div style="padding:40px;color:#8a7d73">No results - check TMDB key</div>`;
    }
  },400);
});

document.getElementById('genreBar').addEventListener('click', e=>{if(e.target.classList.contains('chip'))filterGenre(e.target.dataset.genre);});

loadInitial();
let loadingMore=false;
window.addEventListener('scroll',()=>{if(loadingMore)return;if(window.innerHeight+window.scrollY>=document.body.offsetHeight-1200){loadingMore=true;loadMore().then(()=>loadingMore=false);}});
</script>
