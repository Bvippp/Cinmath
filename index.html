<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TUBEMOCHA • Watch Free Movies & TV Shows Online</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   CORE PALETTE & RESET
   ═══════════════════════════════════════════ */
:root {
  --bg-main: #14100d;
  --bg-card: #1e1814;
  --bg-elevated: #2a211a;
  --border: #3a2e26;
  --border-light: #302520;
  --text-main: #f0e8dd;
  --text-muted: #9a8e80;
  --text-dim: #7a6e62;
  --accent: #c89666;
  --accent-light: #f5ede3;
  --accent-red: #d94b4b;
  --accent-blue: #8ba5c4;
  --accent-green: #7fa65e;
  --star: #c89666;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --bottom-nav-height: 72px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  background: var(--bg-main);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 20px);
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; -webkit-tap-highlight-color: transparent; border: none; background: none; cursor: pointer; }
::-webkit-scrollbar { width: 0; height: 0; }
img { display: block; max-width: 100%; }

/* TOP BAR */
.topbar {
  position: sticky; top: 0; z-index: 120;
  background: linear-gradient(to bottom, rgba(20,16,13,0.98) 0%, rgba(20,16,13,0.85) 70%, transparent 100%);
  backdrop-filter: blur(12px);
}
.topbar-inner {
  height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; max-width: 1400px; margin: 0 auto;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 900; font-size: 22px; letter-spacing: -0.03em;
  cursor: pointer; font-family: 'Outfit', sans-serif;
}
.logo .m {
  width: 36px; height: 36px; border-radius: 9px;
  background: var(--accent); color: var(--bg-main);
  display: grid; place-items: center; font-size: 22px; font-weight: 900; line-height: 1;
}
.search-top { flex: 1; display: flex; justify-content: flex-end; }
.search-form {
  display: flex; align-items: center;
  background: rgba(30,24,20,0.6); border: 1px solid var(--border);
  border-radius: var(--radius-md); height: 40px; padding: 0 5px 0 14px;
  width: 100%; max-width: 380px;
}
.search-form input { flex: 1; background: transparent; border: 0; color: var(--text-main); outline: none; font-size: 15px; height: 100%; }
.search-form button { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--accent-light); color: var(--bg-main); display: grid; place-items: center; }

/* HERO, CARDS, LAYOUT (Same as before) */
.hero { position: relative; height: 75vh; min-height: 480px; max-height: 680px; overflow: hidden; background: var(--bg-main); }
.hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.hero-slide.active { opacity: 1; pointer-events: auto; }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; z-index: 1; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg-main) 0%, rgba(20,16,13,0.88) 35%, rgba(20,16,13,0) 80%); z-index: 2; pointer-events: none; }
.hero-c { position: relative; z-index: 3; padding: 0 20px 60px; max-width: 1400px; margin: 0 auto; width: 100%; }
.hero-title { font-size: 38px; font-weight: 800; line-height: 1.08; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 12px; }
.hero-meta { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 14px; flex-wrap: wrap; }
.hero-meta .star { color: var(--star); }
.hero-desc { font-size: 14px; line-height: 1.55; color: #d1c7bb; max-width: 600px; margin-bottom: 22px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.btn-play { height: 44px; padding: 0 28px; border-radius: var(--radius-pill); background: var(--accent-light); color: var(--bg-main); font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.btn-info { height: 44px; padding: 0 24px; border-radius: var(--radius-pill); background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }

.main { max-width: 1400px; margin: 0 auto; padding: 0 0 30px; }
.section-head { display: flex; align-items: center; gap: 12px; padding: 0 20px; margin: 30px 0 16px; }
.section-accent { width: 4px; height: 24px; background: var(--accent-red); border-radius: 2px; }
.section-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin: 0; line-height: 1.2; display: flex; align-items: center; gap: 6px; }
.section-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; font-weight: 500; }

.scroller { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 0 20px 10px; -webkit-overflow-scrolling: touch; }
.card { flex: 0 0 140px; cursor: pointer; }
@media (min-width: 390px) { .card { flex: 0 0 155px; } }
@media (min-width: 768px) { .card { flex: 0 0 180px; } }
.poster { position: relative; aspect-ratio: 2/3; border-radius: var(--radius-md); overflow: hidden; background: var(--bg-card); border: 1px solid var(--border-light); }
.poster img { width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; backdrop-filter: blur(4px); }
.badge.hd { background: rgba(200,150,102,0.95); color: var(--bg-main); }
.badge.tv { background: rgba(139,165,196,0.95); color: var(--bg-main); }
.badge.rating { left: auto; right: 8px; background: rgba(20,16,13,0.8); color: var(--accent-light); border: 1px solid rgba(255,255,255,0.1); }
.card-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); margin-top: 10px; }
.card-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; font-weight: 500; }

/* MOVIE DETAILS & TV SHOW UI */
.detail-overlay { position: fixed; inset: 0; z-index: 300; background: var(--bg-main); overflow-y: auto; display: none; }
.detail-overlay.open { display: block; }
.detail-trailer-bg { position: absolute; inset: 0; height: 100vh; z-index: 0; overflow: hidden; pointer-events: none; }
.detail-trailer-bg iframe { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; transform: translate(-50%, -50%); opacity: 0.45; }
.detail-trailer-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg-main) 0%, rgba(20,16,13,0.7) 40%, rgba(20,16,13,0.3) 100%), linear-gradient(90deg, var(--bg-main) 0%, transparent 40%); }
.detail-content { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; padding: 60px 20px 100px; max-width: 1400px; margin: 0 auto; }
.detail-back { position: absolute; top: 16px; left: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgba(30,24,20,0.6); backdrop-filter: blur(8px); border: 1px solid var(--border); color: var(--text-main); display: grid; place-items: center; }
.detail-body { margin-top: auto; margin-bottom: auto; max-width: 700px; }
.detail-title { font-size: 48px; font-weight: 900; line-height: 1.05; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.6); margin-bottom: 16px; }
.detail-meta { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; flex-wrap: wrap; }
.detail-desc { font-size: 15px; line-height: 1.6; color: #d1c7bb; margin-bottom: 24px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.detail-actions { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.btn-detail-play { height: 50px; padding: 0 36px; border-radius: var(--radius-pill); background: var(--accent-light); color: var(--bg-main); font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; }
.btn-detail-secondary { height: 50px; padding: 0 24px; border-radius: var(--radius-pill); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); }
.cast-scroller { display: flex; gap: 16px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; }
.cast-card { flex: 0 0 100px; text-align: center; }
.cast-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-elevated); margin-bottom: 8px; }
.cast-name { font-size: 12.5px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cast-role { font-size: 11px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tv-seasons-container { margin-top: 30px; padding-bottom: 20px; }
.tv-seasons-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.tv-season-select { background: rgba(30,24,20,0.6); border: 1px solid var(--border); color: var(--text-main); font-size: 20px; font-weight: 800; padding: 8px 12px; border-radius: var(--radius-md); outline: none; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23f0e8dd%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 14px auto; padding-right: 40px; }
.tv-episode-count { font-size: 13px; color: var(--text-dim); font-weight: 600; }
.tv-episode-list { display: flex; flex-direction: column; gap: 12px; }
.episode-card { display: flex; gap: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; cursor: pointer; transition: 0.2s; }
.episode-thumb { width: 140px; aspect-ratio: 16/9; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; background: var(--bg-elevated); }
.episode-info { display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0; }
.episode-number { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.episode-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.episode-runtime { font-size: 12px; color: var(--text-dim); font-weight: 500; }

/* ═══════════════════════════════════════════
   FULLSCREEN CUSTOM PLAYER OVERLAY (Movy.sx Style)
   ═══════════════════════════════════════════ */
.player-overlay {
  position: fixed; inset: 0; z-index: 700;
  background: #000; display: none;
  flex-direction: column;
}
.player-overlay.open { display: flex; }

/* Player Top Bar */
.player-topbar {
  height: 64px; display: flex; align-items: center; gap: 16px;
  padding: 0 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  transition: opacity 0.3s;
}
.player-back {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; display: grid; place-items: center; flex-shrink: 0;
}
.player-title-group { flex: 1; min-width: 0; }
.player-title {
  font-size: 16px; font-weight: 800; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-subtitle {
  font-size: 12px; color: var(--text-muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-actions { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
.p-btn {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; font-weight: 700;
}

/* Pre-play Overlay */
.player-preplay {
  position: absolute; inset: 0; z-index: 10;
  background: #000; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.player-preplay-bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0.6;
}
.player-preplay-content {
  position: relative; z-index: 2; display: flex; flex-direction: column;
  align-items: center; gap: 24px; text-align: center; padding: 20px;
}
.server-select-wrapper {
  display: flex; align-items: center; gap: 8px;
  background: rgba(30,24,20,0.85); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 8px 16px;
}
.server-select-wrapper span { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.server-select {
  background: transparent; border: none; color: #fff;
  font-size: 14px; font-weight: 800; outline: none; cursor: pointer;
  appearance: none; padding-right: 20px;
  background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  background-repeat: no-repeat; background-position: right 0 top 50%;
  background-size: 10px auto;
}
.btn-play-now {
  background: #1db954; color: #000;
  font-size: 16px; font-weight: 900; letter-spacing: 0.05em;
  padding: 14px 40px; border-radius: var(--radius-pill);
  display: inline-flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 20px rgba(29,185,84,0.4);
  transition: transform 0.2s;
}
.btn-play-now:active { transform: scale(0.96); }

/* Skip Ad Overlay */
.player-skip-ad {
  position: absolute; bottom: 80px; left: 30px; z-index: 15;
  width: 90px; height: 90px; border-radius: 50%;
  background: #fff; color: #000; font-weight: 800; font-size: 13px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 0 0 4px rgba(255,255,255,0.2);
  cursor: pointer; display: none;
}
.player-skip-ad.show { display: flex; animation: pulseAd 2s infinite; }
@keyframes pulseAd { 0%,100% { box-shadow: 0 0 0 4px rgba(255,255,255,0.2); } 50% { box-shadow: 0 0 0 12px rgba(255,255,255,0); } }

/* Iframe Container */
.player-iframe-wrapper {
  position: absolute; inset: 0; z-index: 5; background: #000;
  display: none;
}
.player-iframe-wrapper iframe {
  width: 100%; height: 100%; border: 0;
}

/* Player Bottom Bar */
.player-bottombar {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
  height: 80px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
}
.btn-skip-ad-bottom {
  background: #fff; color: #000; font-weight: 800; font-size: 13px;
  padding: 10px 20px; border-radius: var(--radius-pill);
  display: flex; align-items: center; gap: 6px;
}
.btn-episodes-toggle {
  background: rgba(255,255,255,0.15); color: #fff; font-weight: 700; font-size: 14px;
  padding: 10px 20px; border-radius: var(--radius-pill);
  display: flex; align-items: center; gap: 6px;
}

/* Episodes Drawer */
.player-episodes-drawer {
  position: absolute; bottom: 80px; right: 20px; width: 320px; max-height: 60vh;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md);
  z-index: 25; display: none; flex-direction: column; overflow: hidden;
}
.player-episodes-drawer.open { display: flex; }
.drawer-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 800; color: var(--text-main); font-size: 14px; }
.drawer-list { flex: 1; overflow-y: auto; padding: 8px; }
.drawer-episode {
  display: flex; gap: 12px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer;
}
.drawer-episode:hover { background: var(--bg-elevated); }
.drawer-episode.active { background: rgba(200,150,102,0.2); border-left: 3px solid var(--accent); }
.drawer-ep-thumb { width: 80px; aspect-ratio: 16/9; border-radius: 4px; object-fit: cover; }
.drawer-ep-info { flex: 1; min-width: 0; }
.drawer-ep-title { font-size: 12px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-ep-num { font-size: 10px; color: var(--accent); font-weight: 800; margin-bottom: 2px; }

/* BOTTOM NAVIGATION */
.bottom {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 250;
  background: rgba(30,24,20,0.95); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 8px 12px; display: flex; gap: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  width: calc(100% - 32px); max-width: 440px; justify-content: space-between;
}
.bottom button {
  flex: 1; height: 48px; border-radius: var(--radius-md);
  background: transparent; display: flex; align-items: center;
  justify-content: center; color: var(--text-dim);
}
.bottom button svg {
  width: 22px; height: 22px; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.bottom button.active { background: rgba(245,237,227,0.12); color: var(--accent-light); }
.bottom button.active svg { stroke: var(--accent-light); }

/* UTILS */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--accent-light); color: var(--bg-main);
  padding: 10px 20px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: 13px; display: none; z-index: 600;
}
.toast.show { display: block; }
.view { display: none; animation: fade 0.3s; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="logo" onclick="navigate('home')">
      <div class="m">M</div><b>TUBEMOCHA</b>
    </div>
    <div class="search-top">
      <form class="search-form" action="." method="get" role="search" autocomplete="off" onsubmit="return handleSearch(event)">
        <input id="q" type="search" name="search" enterhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search movies, TV shows..." />
        <button type="submit" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
      </form>
    </div>
  </div>
</div>

<!-- HOME VIEW -->
<div id="view-home" class="view active">
  <div class="hero" id="hero">
    <!-- Hero slides (simplified for brevity, full structure same as before) -->
    <div class="hero-slide active" id="heroSlide1">
      <img class="hero-bg" id="heroBg1" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
      <div class="hero-c">
        <h1 class="hero-title" id="heroTitle1">Loading...</h1>
        <div class="hero-meta" id="heroMeta1"></div>
        <p class="hero-desc" id="heroDesc1"></p>
        <div class="hero-actions">
          <button class="btn-play" id="heroPlay1"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Play</button>
          <button class="btn-info" id="heroInfo1">More info</button>
        </div>
      </div>
    </div>
    <!-- Dots omitted -->

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG & PROVIDERS (Core + Extras from tmdb-embed-providers)
   ══════════════════════════════════════════════════════════════ */
const TMDB_KEY = '3d1cb94d909aab088231f5af899dffdc';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p/w500';
const BACKDROP = 'https://image.tmdb.org/t/p/original';
const PROFILE = 'https://image.tmdb.org/t/p/w185';

const EMBED_PROVIDERS = [
  { name: 'VidLink', movie: id => `https://vidlink.pro/movie/${id}`, tv: (id, s, e) => `https://vidlink.pro/tv/${id}/${s}/${e}` },
  { name: 'VidSrc.pm', movie: id => `https://vidsrc.pm/embed/movie/${id}`, tv: (id, s, e) => `https://vidsrc.pm/embed/tv/${id}/${s}/${e}` },
  { name: 'Nontongo', movie: id => `https://www.nontongo.win/embed/movie/${id}`, tv: (id, s, e) => `https://www.nontongo.win/embed/tv/${id}/${s}/${e}` },
  { name: 'SmashyStream', movie: id => `https://player.smashy.stream/movie/${id}`, tv: (id, s, e) => `https://player.smashy.stream/tv/${id}?s=${s}&e=${e}` },
  { name: 'VidFast', movie: id => `https://vidfast.pro/movie/${id}`, tv: (id, s, e) => `https://vidfast.pro/tv/${id}/${s}/${e}` },
  { name: '2Embed', movie: id => `https://www.2embed.cc/embed/${id}`, tv: (id, s, e) => `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}` },
  { name: 'AutoEmbed', movie: id => `https://autoembed.co/movie/tmdb/${id}`, tv: (id, s, e) => `https://autoembed.co/tv/tmdb/${id}-${s}-${e}` },
  { name: 'VidSrc.to', movie: id => `https://vidsrc.to/embed/movie/${id}`, tv: (id, s, e) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}` },
  { name: 'VidSrc.cc', movie: id => `https://vidsrc.cc/v2/embed/movie/${id}`, tv: (id, s, e) => `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}` },
  { name: 'MoviesAPI', movie: id => `https://moviesapi.to/movie/${id}`, tv: (id, s, e) => `https://moviesapi.to/tv/${id}-${s}-${e}` }
];

let filterState = { genre: '', year: '', country: '', sort: 'popularity.desc', page: 1 };
let allCache = [], currentMovie = null, heroMovies = [];
let watchlist = JSON.parse(localStorage.getItem('tubemocha_watchlist')) || [];

let currentSeason = 1;
let currentEpisode = 1;
let currentProviderIndex = 0;
let isPlaying = false;

const GENRE_MAP = { "28":"Action","12":"Adventure","16":"Animation","35":"Comedy","80":"Crime","99":"Documentary","18":"Drama","10751":"Family","14":"Fantasy","36":"History","27":"Horror","10402":"Music","9648":"Mystery","10749":"Romance","878":"Sci-Fi","10770":"TV Movie","53":"Thriller","10752":"War","37":"Western" };
const FALLBACK = [ {id:603,t:"The Matrix",y:1999,r:"8.2",g:["Action","Sci-Fi"],d:"A hacker learns the truth.",p:"https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg",b:"https://image.tmdb.org/t/p/original/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg",tmdb:603} ];

/* ══════════════════════════════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════════════════════════════ */
function toast(m) {
  const e = document.getElementById('toast');
  if (!e) return;
  e.textContent = m;
  e.classList.add('show');
  clearTimeout(e._t);
  e._t = setTimeout(() => e.classList.remove('show'), 3000);
}

async function tmdb(path, params = {}) {
  const target = new URL(TMDB_BASE + path);
  target.searchParams.set('api_key', TMDB_KEY);
  Object.entries(params).forEach(([k,v]) => { if (v != null && v !== '') target.searchParams.set(k, String(v)); });
  try {
    const res = await fetch(target.href);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) { return null; }
}

function mapResult(r) {
  const isTV = r.media_type === 'tv' || (!r.title && !!r.name);
  return {
    id: r.id, t: r.title || r.name || 'Untitled',
    y: r.release_date ? +r.release_date.slice(0,4) : (r.first_air_date ? +r.first_air_date.slice(0,4) : 2024),
    r: r.vote_average ? r.vote_average.toFixed(1) : '7.5',
    g: (r.genre_ids && r.genre_ids.length) ? r.genre_ids.map(id => GENRE_MAP[id] || 'Movie') : ['Movie'],
    d: r.overview || '', p: r.poster_path ? IMG + r.poster_path : '', b: r.backdrop_path ? BACKDROP + r.backdrop_path : '',
    tmdb: r.id, media_type: isTV ? 'tv' : 'movie', _tv: isTV,
    seasons: r.number_of_seasons, episodes: r.number_of_episodes, runtime: r.runtime
  };
}

function cardHTML(m) {
  const isTV = m.media_type === 'tv' || m._tv === true;
  const title = String(m.t || m.title || 'Untitled').substring(0, 38);
  const poster = m.p || '';
  const rating = m.r || '7.5';
  const year = m.y || 2024;
  const genres = (m.g || ['Movie']).slice(0,2).join(' • ');
  const badgeClass = isTV ? 'tv' : 'hd';
  const badgeText = isTV ? 'TV' : 'HD';
  const clickId = isTV ? ('tv-' + m.id) : m.id;
  return `<div class="card" onclick="openMovie('${clickId}')">
    <div class="poster">
      <img src="${poster}" loading="lazy" alt="" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'450\' viewBox=\'0 0 300 450\'%3E%3Crect fill=\'%231e1814\' width=\'300\' height=\'450\'/%3E%3Ctext fill=\'%235f5449\' x=\'50%25\' y=\'50%25\' font-family=\'sans-serif\' font-size=\'14\' text-anchor=\'middle\' dominant-baseline=\'middle\'%3ENo Image%3C/text%3E%3C/svg%3E'">
      <span class="badge ${badgeClass}">${badgeText}</span>
      <span class="badge rating"><span>★</span> ${rating}</span>
    </div>
    <div class="card-title">${title}</div>
    <div class="card-sub">${rating} · ${year} · ${genres}</div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   DETAILS PAGE LOGIC
   ══════════════════════════════════════════════════════════════ */
async function openMovie(rawId) {
  let isTV = false, id = rawId;
  if (typeof rawId === 'string' && rawId.indexOf('tv-') === 0) { isTV = true; id = rawId.substring(3); }

  let m = allCache.find(x => String(x.id) === String(id) && (x.media_type === 'tv') === isTV);
  if (!m) {
    const d = await tmdb((isTV ? '/tv/' : '/movie/') + id, { append_to_response: 'videos,credits' });
    if (d && d.id) { m = mapResult(d); m.videos = d.videos; m.credits = d.credits; }
    else m = FALLBACK[0];
  }

  currentMovie = m;
  document.getElementById('detailTitle').textContent = m.t;
  document.getElementById('detailDesc').textContent = m.d || '';

  const typeLabel = isTV ? 'TV Series' : 'Movie';
  const durationStr = isTV ? (m.seasons ? `${m.seasons} Season${m.seasons > 1 ? 's' : ''}` : 'TV Show') : (m.runtime ? `${m.runtime}m` : '2h 10m');
  const ratingStr = isTV ? 'M18' : 'R';

  document.getElementById('detailMeta').innerHTML = `
    <span class="star">★ ${m.r}</span> <span class="divider">·</span>
    <span class="vote-box">⇧ ${m.vote_count || '120'}</span>
    <span class="vote-box">⇩ ${m.vote_count ? Math.floor(m.vote_count/10) : '12'}</span>
    <span class="divider">·</span> <span>${m.y}</span> <span class="divider">·</span> <span>${durationStr}</span>
    <span class="divider">·</span> <span class="vote-box" style="color:#fff; border-color:#fff;">4K</span>
    <span class="vote-box" style="color:#fff; border-color:#fff;">${ratingStr}</span>
    <br><span style="font-size:13px; color:var(--text-dim); margin-top:4px;">${(m.g || ['Movie']).slice(0,3).join(' · ')}</span>
  `;

  document.getElementById('detailOverlay').style.background = `url(${m.b || m.p}) center/cover no-repeat`;

  const trailerBg = document.getElementById('detailTrailerBg');
  trailerBg.innerHTML = '';
  if (m.videos && m.videos.results) {
    const tr = m.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
    if (tr) trailerBg.innerHTML = `<iframe src="https://www.youtube.com/embed/${tr.key}?autoplay=1&mute=1&controls=0&loop=1&playlist=${tr.key}&showinfo=0&rel=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
  }

  const castScroller = document.getElementById('castScroller');
  castScroller.innerHTML = (m.credits && m.credits.cast) ? m.credits.cast.slice(0, 10).map(c => `
    <div class="cast-card">
      <img src="${c.profile_path ? PROFILE + c.profile_path : 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'%3E%3Crect fill=\'%231e1814\' width=\'100\' height=\'100\'/%3E%3Ccircle cx=\'50\' cy=\'40\' r=\'20\' fill=\'%233a2e26\'/%3E%3Cpath d=\'M20 90 Q 50 50 80 90\' stroke=\'%233a2e26\' stroke-width=\'20\' fill=\'none\'/%3E%3C/svg%3E'}" alt="">
      <div class="cast-name">${c.name}</div><div class="cast-role">${c.character || ''}</div>
    </div>`).join('') : '<div class="empty">No cast info</div>';

  if (isTV) {
    document.getElementById('tvSeasonsContainer').style.display = 'block';
    document.getElementById('detailPlayBtn').innerHTML = `▶ Play S1 E1`;
    currentSeason = 1; currentEpisode = 1;
    await setupTVSeasons(m.id);
  } else {
    document.getElementById('tvSeasonsContainer').style.display = 'none';
    document.getElementById('detailPlayBtn').innerHTML = `▶ Play`;
  }

  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

async function setupTVSeasons(showId) {
  const select = document.getElementById('tvSeasonSelect');
  select.innerHTML = '<option value="1">Loading...</option>';
  const data = await tmdb(`/tv/${showId}`);
  if (!data || !data.seasons) { select.innerHTML = '<option value="1">Season 1</option>'; return; }
  const validSeasons = data.seasons.filter(s => s.season_number > 0).sort((a, b) => a.season_number - b.season_number);
  select.innerHTML = validSeasons.map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');
  changeSeason(validSeasons.length > 0 ? validSeasons[0].season_number : 1);
}

async function changeSeason(seasonNum) {
  currentSeason = parseInt(seasonNum); currentEpisode = 1;
  const listEl = document.getElementById('tvEpisodeList');
  const countEl = document.getElementById('tvEpisodeCount');
  listEl.innerHTML = '<div class="empty">Loading...</div>';
  document.getElementById('detailPlayBtn').innerHTML = `▶ Play S${currentSeason} E${currentEpisode}`;

  const data = await tmdb(`/tv/${currentMovie.id}/season/${currentSeason}`);
  if (!data || !data.episodes) { listEl.innerHTML = '<div class="empty">Failed.</div>'; return; }

  countEl.textContent = `${data.episodes.length} episodes`;
  listEl.innerHTML = data.episodes.map(ep => `
    <div class="episode-card" onclick="selectEpisode(${currentSeason}, ${ep.episode_number})">
      <img src="${ep.still_path ? `https://image.tmdb.org/t/p/w300${ep.still_path}` : ''}" class="episode-thumb" alt="">
      <div class="episode-info">
        <div class="episode-number">EPISODE ${ep.episode_number}</div>
        <div class="episode-title">${ep.name || 'Untitled Episode'}</div>
        <div class="episode-runtime">${ep.runtime ? ep.runtime + ' min' : 'N/A'}</div>
      </div>
    </div>`).join('');
}

function selectEpisode(season, episode) {
  currentSeason = season; currentEpisode = episode;
  document.getElementById('detailPlayBtn').innerHTML = `▶ Play S${currentSeason} E${currentEpisode}`;
  playCurrentMedia();
}

/* ══════════════════════════════════════════════════════════════
   FULLSCREEN CUSTOM PLAYER LOGIC
   ══════════════════════════════════════════════════════════════ */
function playCurrentMedia() {
  if (!currentMovie) return;

  // 1. Configure Top Bar
  document.getElementById('playerTitle').textContent = currentMovie.t;
  document.getElementById('playerSubtitle').textContent = currentMovie._tv ? `S${currentSeason} E${currentEpisode}` : 'Movie';
  document.getElementById('btnNextEp').style.display = currentMovie._tv ? 'flex' : 'none';

  // 2. Setup Pre-play Screen
  document.getElementById('playerPreplayBg').src = currentMovie.b || currentMovie.p;
  
  const serverSelect = document.getElementById('serverSelect');
  serverSelect.innerHTML = EMBED_PROVIDERS.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
  serverSelect.value = currentProviderIndex;

  // 3. Show Pre-play, Hide Iframe
  document.getElementById('playerPreplay').style.display = 'flex';
  document.getElementById('playerIframeWrapper').style.display = 'none';
  document.getElementById('playerSkipAd').classList.remove('show');
  document.getElementById('playerEpisodesDrawer').classList.remove('open');
  
  // 4. Show Overlay
  document.getElementById('playerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  isPlaying = false;
}

function startPlayback() {
  document.getElementById('playerPreplay').style.display = 'none';
  document.getElementById('playerIframeWrapper').style.display = 'block';
  isPlaying = true;

  // Simulate ad skip overlay appearing
  setTimeout(() => {
    document.getElementById('playerSkipAd').classList.add('show');
  }, 1500);

  loadIframeSource();
}

function loadIframeSource() {
  const provider = EMBED_PROVIDERS[currentProviderIndex];
  const iframe = document.getElementById('videoIframe');
  
  let url = '';
  if (currentMovie._tv) {
    url = provider.tv(currentMovie.tmdb, currentSeason, currentEpisode);
  } else {
    url = provider.movie(currentMovie.tmdb);
  }
  
  // Append common autoplay params
  url += (url.includes('?') ? '&' : '?') + 'autoplay=true&title=false';

  iframe.src = url;

  // Fallback logic: If iframe doesn't fire onload within 6 seconds, switch server
  let loaded = false;
  const fallbackTimeout = setTimeout(() => {
    if (!loaded && currentProviderIndex < EMBED_PROVIDERS.length - 1) {
      toast(`Server ${provider.name} is slow. Switching...`);
      currentProviderIndex++;
      document.getElementById('serverSelect').value = currentProviderIndex;
      loadIframeSource();
    }
  }, 6000);

  iframe.onload = () => { loaded = true; clearTimeout(fallbackTimeout); };
}

function changeServer(index) {
  currentProviderIndex = parseInt(index);
  if (isPlaying) loadIframeSource();
}

function skipAd() {
  document.getElementById('playerSkipAd').classList.remove('show');
  toast('Ad skipped');
}

function toggleEpisodesDrawer() {
  const drawer = document.getElementById('playerEpisodesDrawer');
  const isOpen = drawer.classList.contains('open');
  if (!isOpen) {
    // Populate drawer
    const list = document.getElementById('drawerList');
    // Assuming we already have episodes for current season cached, or fetch again
    // For simplicity, we'll just show a message if not TV
    if (!currentMovie._tv) { toast('Episodes only available for TV shows'); return; }
    
    // Re-use the TV season logic to populate drawer
    // In a real scenario, you'd cache the episode list
    list.innerHTML = '<div class="empty" style="padding:20px;font-size:12px">Loading episodes...</div>';
    tmdb(`/tv/${currentMovie.id}/season/${currentSeason}`).then(data => {
      if (data && data.episodes) {
        list.innerHTML = data.episodes.map(ep => `
          <div class="drawer-episode ${ep.episode_number === currentEpisode ? 'active' : ''}" onclick="selectFromDrawer(${ep.episode_number})">
            <img src="${ep.still_path ? `https://image.tmdb.org/t/p/w300${ep.still_path}` : ''}" class="drawer-ep-thumb">
            <div class="drawer-ep-info">
              <div class="drawer-ep-num">E${ep.episode_number}</div>
              <div class="drawer-ep-title">${ep.name || 'Untitled'}</div>
            </div>
          </div>`).join('');
      }
    });
    drawer.classList.add('open');
  } else {
    drawer.classList.remove('open');
  }
}

function selectFromDrawer(episodeNum) {
  currentEpisode = episodeNum;
  document.getElementById('playerSubtitle').textContent = `S${currentSeason} E${currentEpisode}`;
  document.getElementById('playerEpisodesDrawer').classList.remove('open');
  document.getElementById('playerSkipAd').classList.remove('show');
  loadIframeSource();
}

function playNextEpisode() {
  if (!currentMovie._tv) return;
  currentEpisode++;
  document.getElementById('playerSubtitle').textContent = `S${currentSeason} E${currentEpisode}`;
  document.getElementById('playerSkipAd').classList.remove('show');
  loadIframeSource();
}

function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('videoIframe').src = '';
  document.getElementById('playerSkipAd').classList.remove('show');
  document.getElementById('playerEpisodesDrawer').classList.remove('open');
  document.body.style.overflow = '';
  isPlaying = false;
}

function closeDetail() {
  if (document.getElementById('playerOverlay').classList.contains('open')) closePlayer();
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailTrailerBg').innerHTML = '';
  document.body.style.overflow = '';
}

/* ══════════════════════════════════════════════════════════════
   INITIAL LOAD
   ══════════════════════════════════════════════════════════════ */
async function loadInitial() {
  const tr = await tmdb('/trending/movie/week', { page: 1 });
  if (tr && tr.results) {
    const m = tr.results.map(mapResult);
    allCache = m;
    // Setup hero
    const h = m[0];
    document.getElementById('heroBg1').src = h.b || h.p;
    document.getElementById('heroTitle1').textContent = h.t;
    document.getElementById('heroDesc1').textContent = h.d;
    document.getElementById('heroMeta1').innerHTML = `<span class="star">★ ${h.r}</span> · <span>${h.y}</span> · <span>Movie</span>`;
    document.getElementById('heroPlay1').onclick = () => openMovie(h.id);
    document.getElementById('heroInfo1').onclick = () => openMovie(h.id);

    document.getElementById('trendingTrack').innerHTML = m.slice(0, 10).map(cardHTML).join('');
  }
}

loadInitial();
</script>
