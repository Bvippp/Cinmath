MOVY_SX_EXACT.forEach(m=>{ ALL_MOVIES.push({id:idc++, title:m.title, year:m.year, rating:m.rating, genres:m.genres, desc:m.desc, dur:m.dur, rated:m.rated, cast:m.cast, yt:m.yt, poster:m.poster, archive:m.archive, recent:m.recent, views:m.views, backdrop:m.poster}); });
const archiveIds=["night_of_the_living_dead","Nosferatu_1922","TheGeneral","Metropolis1927","Charade1963","his_girl_friday","DasKabinetDesDrCaligari","TheKid1921","PhantomOfTheOpera1925","GulliversTravels1939"];
for(let i=0;i<975;i++){ const base=MOVY_SX_EXACT[i%MOVY_SX_EXACT.length]; const isArchive=i%3===0; ALL_MOVIES.push({id:idc++, title:base.title+(i>25?` ${String.fromCharCode(65+(i%26))}`:''), year:base.year, rating:5.0+(i%35)/10+Math.random()*0.5, genres:base.genres, desc:base.desc, dur:`${80+(i%80)}m`, rated:base.rated||"PG-13", cast:base.cast, yt:base.yt, poster:isArchive?`https://archive.org/services/img/${archiveIds[i%archiveIds.length]}`:base.poster, archive:isArchive?archiveIds[i%archiveIds.length]:base.archive, recent:i%7===0, views:1000+Math.random()*800000, backdrop:base.poster}); }
ALL_MOVIES.forEach(m=>m._s=bestScore(m));
let DISPLAY_COUNT=60; let state={q:"",tab:"home",genre:"All",cur:null,server:"archive"};
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
function filtered(){ let a=[...ALL_MOVIES]; if(state.q){ const q=state.q.toLowerCase(); a=a.filter(m=>(m.title+' '+m.genres.join(' ')+' '+m.year+' '+m.cast.map(c=>c.name).join(' ')).toLowerCase().includes(q)); } if(state.genre!=='All') a=a.filter(m=>m.genres.includes(state.genre)); if(state.tab==='top') a.sort((x,y)=>y.rating-x.rating); else if(state.tab==='movies') a.sort((x,y)=>(y.year||0)-(x.year||0)); else if(state.tab==='tv') a=a.filter(m=>m.genres.includes('Drama')||m.genres.includes('Thriller')).sort((x,y)=>y._s-x._s); else a.sort((x,y)=>y._s-x._s); return a; }
function card(m){ return `<div class="card" onclick="openMovie(${m.id})"><div class="poster"><img src="${m.poster}" loading="lazy" onerror="this.style.display='none'" alt="${m.title}"><div class="card-badge">${m.recent?`<span class="badge-mini recent">Recently added</span>`:''}</div><div class="card-meta-top">${m.rating>=7.5?`<span class="mini-rating">★ ${m.rating.toFixed(1)}</span>`:''}</div></div><div class="card-info"><div class="card-title">${m.title}</div><div class="card-sub"><span>${m.year}</span><span>${m.genres[0]}</span></div></div></div>`; }
function renderGenreBar(){ const genres=["All","Action","Comedy","Drama","Horror","Sci-Fi","Thriller","Animation","Family","Crime","Adventure","Fantasy","Chinese","Mystery","Classic"]; document.getElementById('genreBar').innerHTML=genres.map(g=>`<button class="genre-chip ${state.genre===g?'active':''}" onclick="setGenre('${g}')">${g}</button>`).join(''); }
function setGenre(g){ state.genre=g; renderGenreBar(); DISPLAY_COUNT=60; if(state.tab==='home'){ renderHome(); } else{ renderMoviesGrid(); } toast(`${g}: ${filtered().length} films`); }
function setTab(tab){ state.tab=tab; state.genre="All"; DISPLAY_COUNT=60; document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); document.getElementById('nav-'+tab).classList.add('active'); document.getElementById('homePage').style.display=tab==='home'?'block':'none'; document.getElementById('moviesPage').style.display=tab==='home'?'none':'block'; document.getElementById('genreGrid').style.display=tab==='genres'?'grid':'none'; document.getElementById('moviesGrid').style.display=tab==='genres'?'none':'grid'; if(tab==='genres') renderGenres(); else if(tab==='home') renderHome(); else renderMoviesGrid(); }
function goHome(){ setTab('home'); }
function renderHome(){ const all=filtered(); const trending=all.slice(0,18); const recent=[...ALL_MOVIES].filter(m=>m.recent).slice(0,12); const top=[...ALL_MOVIES].sort((a,b)=>b.rating-a.rating).slice(0,12); document.getElementById('sections').innerHTML=`<div class="section"><div class="s-head"><div class="s-title" onclick="setTab('movies')">Trending This Week</div><div class="s-link" onclick="setTab('movies')">View All</div></div><div class="track">${trending.map(card).join('')}</div></div>${recent.length?`<div class="section"><div class="s-head"><div class="s-title" onclick="setTab('movies')">Recently added</div><div class="s-link" onclick="setTab('movies')">View All</div></div><div class="track">${recent.map(card).join('')}</div></div>`:''}<div class="section"><div class="s-head"><div class="s-title" onclick="setTab('top')">Top Rated • IMDB</div><div class="s-link" onclick="setTab('top')">View All</div></div><div class="track">${top.map(card).join('')}</div></div><div class="section"><div class="s-head"><div class="s-title">More like Movy.sx</div></div><div class="grid">${all.slice(0,24).map(card).join('')}</div></div>`; renderGenreBar(); }
function renderMoviesGrid(){ const all=filtered(); const show=all.slice(0,DISPLAY_COUNT); document.getElementById('moviesGrid').innerHTML=show.map(card).join('')||'<div style="padding:40px;text-align:center;color:#6e6e6e">No movies found</div>'; document.getElementById('loadMore').style.display=DISPLAY_COUNT>=all.length?'none':'inline-flex'; }
function renderGenres(){ const genres=["Action","Comedy","Drama","Horror","Sci-Fi","Thriller","Animation","Family","Crime","Adventure","Fantasy","Chinese","Mystery","Romance","Classic"]; document.getElementById('genreGrid').innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px">${genres.map(g=>{ const count=ALL_MOVIES.filter(m=>m.genres.includes(g)).length; return `<div style="height:90px;border-radius:10px;background:#111;border:1px solid #1a1a1a;padding:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between" onclick="setGenre('${g}'); setTab('movies')"><div><div style="font-weight:700;color:#f0e6d9">${g}</div><div style="font-size:10px;color:#6e6e6e">${count} movies</div></div><div style="font-size:10px;color:#c19a6b">Click to view →</div></div>`; }).join('')}</div>`; }
function loadMore(){ DISPLAY_COUNT+=60; renderMoviesGrid(); }
function openMovie(id){ const m=ALL_MOVIES.find(x=>x.id===id); if(!m) return; state.cur=m; state.server=m.archive?'archive':'youtube'; document.getElementById('detailTitle').textContent=m.title; document.getElementById('detailTopTitle').textContent=m.title; document.getElementById('detailMeta').innerHTML=`<span class="pill white">★ ${m.rating.toFixed(1)}</span><span class="pill">${m.year}</span><span class="pill">${m.dur}</span><span class="pill">${m.rated||'PG-13'}</span>${m.genres.map(g=>`<span class="pill brown" onclick="closeDetail(); setGenre('${g}'); setTab('movies')">${g}</span>`).join('')}`; document.getElementById('detailDesc').textContent=m.desc; document.getElementById('detailDetails').innerHTML=`<div style="display:flex;justify-content:space-between"><span>Year</span><span style="color:#f0e6d9">${m.year}</span></div><div style="display:flex;justify-content:space-between"><span>Rating</span><span style="color:#f0e6d9">★ ${m.rating.toFixed(1)}</span></div><div style="display:flex;justify-content:space-between"><span>Duration</span><span style="color:#f0e6d9">${m.dur}</span></div><div style="display:flex;justify-content:space-between"><span>Rated</span><span style="color:#f0e6d9">${m.rated||'PG-13'}</span></div><div style="display:flex;justify-content:space-between"><span>Actual Movie</span><span style="color:#c19a6b">${m.archive?'Full film plays':'Trailer'}</span></div>`; document.getElementById('detailCast').innerHTML=m.cast.map(c=>`<div class="cast-card" onclick="closeDetail(); document.getElementById('q').value='${c.name}'; state.q='${c.name}'; setTab('movies'); renderMoviesGrid();"><div class="cast-img">${c.img?`<img src="${c.img}">`:`${c.name.substring(0,2).toUpperCase()}`}</div><div class="cast-name">${c.name}</div><div class="cast-char">${c.char}</div></div>`).join(''); document.getElementById('detailGenres').innerHTML=m.genres.map(g=>`<button class="genre-chip" onclick="closeDetail(); setGenre('${g}'); setTab('movies')">${g}</button>`).join(''); const similar=ALL_MOVIES.filter(x=>x.id!==m.id).map(o=>{ const inter=o.genres.filter(g=>m.genres.includes(g)).length; const uni=new Set([...o.genres,...m.genres]).size; return {...o,sim:uni?inter/uni:0}; }).sort((a,b)=>b.sim-a.sim).slice(0,10); document.getElementById('similar').innerHTML=similar.map(card).join(''); document.getElementById('detail').classList.add('open'); setServer(state.server); window.scrollTo(0,0); history.pushState(null,null,`?movie=${m.id}`); }
function setServer(s){ state.server=s; document.querySelectorAll('.server-btn').forEach(b=>b.classList.remove('active')); document.getElementById(s==='archive'?'srv1':s==='youtube'?'srv2':'srv3').classList.add('active'); const m=state.cur; if(!m) return; const wrap=document.getElementById('playerWrap'); if(s==='archive' && m.archive){ wrap.innerHTML=`<iframe src="https://archive.org/embed/${m.archive}" frameborder="0" allowfullscreen webkitallowfullscreen></iframe>`; toast(`${m.title} • Actual movie playing`); } else if(s==='archive' && !m.archive){ wrap.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#f0e6d9;text-align:center;padding:20px"><div><div style="font-size:14px;font-weight:700;margin-bottom:8px">No Archive full film for ${m.title}</div><div style="font-size:12px;color:#888">Server 2 has trailer with right movie</div><button onclick="setServer('youtube')" style="margin-top:12px;height:36px;padding:0 16px;border-radius:8px;background:#f0e6d9;color:#080808;border:0;font-weight:700;cursor:pointer">Play Trailer • Right Movie</button></div></div>`; } else { wrap.innerHTML=`<iframe src="https://www.youtube.com/embed/${m.yt}?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`; toast(`${m.title} • Right trailer playing`); } }
function closeDetail(){ document.getElementById('detail').classList.remove('open'); document.getElementById('playerWrap').innerHTML=''; history.pushState(null,null,location.pathname); }
document.getElementById('q').addEventListener('input',e=>{ state.q=e.target.value; DISPLAY_COUNT=60; if(state.tab==='home') renderHome(); else renderMoviesGrid(); });
(function(){ renderGenreBar(); renderHome(); const id=new URLSearchParams(location.search).get('movie'); if(id) openMovie(Number(id)); toast(`Brown Mocha • Like Movy.sx • ${ALL_MOVIES.length} films • Every feature clickable`); })();
</script>
</body>
</html>
