<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TUBEMOCHA - Free Cinema</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f5ebe0;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-bottom:1px solid #252525;height:58px;display:flex;align-items:center;gap:10px;padding:0 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.04em}
.logo b{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#8d6e63,#c19a6b);display:grid;place-items:center;color:#0a0a0a}
.logo span{color:#c19a6b}
.search{flex:1;max-width:320px;position:relative}
.search input{width:100%;height:36px;background:#1a1a1a;border:1px solid #252525;border-radius:10px;padding:0 10px 0 32px;color:#f5ebe0;outline:none;font-size:13px}
.hero{max-width:1440px;margin:0 auto;height:440px;position:relative;overflow:hidden;background:#111}
@media(max-width:600px){.hero{height:380px}}
.hero-bg{position:absolute;inset:0}
.hero-grad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.95) 0%,rgba(10,10,10,.6) 40%,rgba(10,10,10,.1) 70%),linear-gradient(0deg,#0a0a0a 0%,transparent 60%)}
.hero-c{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 12px}
.pill{height:22px;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:9px;font-weight:700;display:inline-flex;align-items:center}
.pill.r{background:#f5ebe0;color:#0a0a0a}.pill.b{color:#c19a6b;border-color:rgba(193,154,107,.3)}
.btn{height:40px;padding:0 14px;border-radius:10px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:5px;border:0;cursor:pointer}
.btn-p{background:#f5ebe0;color:#0a0a0a}.btn-g{background:rgba(255,255,255,.12);color:#f5ebe0;border:1px solid rgba(255,255,255,.15)}
.section{max-width:1440px;margin:0 auto;padding:16px 12px 0}.s-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.s-title{font-size:14px;font-weight:700}
.track{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.track::-webkit-scrollbar{display:none}
.card{flex:0 0 140px;cursor:pointer}
@media(min-width:700px){.card{flex:0 0 152px}}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#161616;border:1px solid #252525}
.poster-bg{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:32px;color:rgba(245,235,224,.85)}
.play-ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);opacity:0;transition:.2s}.card:hover .play-ov{opacity:1}
.circle{width:40px;height:40px;border-radius:50%;background:#f5ebe0;display:grid;place-items:center;color:#0a0a0a;font-size:16px}
.meta{padding:5px 2px 0}.t{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:9px;color:#8a8a8a;display:flex;justify-content:space-between;margin-top:2px}
.detail{position:fixed;inset:0;z-index:100;background:#0a0a0a;overflow-y:auto;display:none}.detail.open{display:block}
.dtop{position:sticky;top:0;z-index:5;height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-bottom:1px solid #252525}
.player{max-width:1000px;margin:12px auto 0;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid #252525;position:relative}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.poster-play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(60% 60% at 30% 20%, #2a1d17, #0a0a0a);cursor:pointer}
.big-play{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#8d6e63,#c19a6b);display:grid;place-items:center;color:#0a0a0a;font-size:26px;box-shadow:0 10px 28px rgba(193,154,107,.35);margin-bottom:10px}
.info{max-width:1000px;margin:12px auto;padding:0 12px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
@media(max-width:800px){.info{grid-template-columns:1fr}}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#f5ebe0;color:#0a0a0a;padding:9px 13px;border-radius:999px;font-weight:700;font-size:11px;display:none;z-index:200}.toast.show{display:block}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><b>T</b> TUBE<span>MOCHA</span></div>
  <div class="search"><input id="q" placeholder="Search movies..."></div>
  <button id="listBtn" style="height:32px;padding:0 10px;border-radius:8px;background:#1a1a1a;border:1px solid #252525;color:#f5ebe0;font-weight:600;font-size:11px">List <span id="lc" style="background:#c19a6b;color:#0a0a0a;border-radius:999px;padding:1px 5px;margin-left:2px">0</span></button>
</div>
<div id="home">
  <div class="hero" id="hero"></div>
  <div id="rows"></div>
</div>
<div class="detail" id="detail">
  <div class="dtop"><button onclick="closeD()" style="width:32px;height:32px;border-radius:8px;background:#1a1a1a;border:1px solid #252525;color:#f5ebe0">←</button><div style="font-weight:700;font-size:12px">TUBEMOCHA</div><div style="flex:1"></div><span id="dPlat" class="pill b"></span></div>
  <div class="player" id="player"></div>
  <div class="info">
    <div>
      <h1 id="dTitle" style="font-size:22px;font-weight:800;line-height:.95"></h1>
      <div id="dMeta" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px"></div>
      <p id="dDesc" style="margin-top:8px;color:#d1d1d1;font-family:Inter;font-size:12px;line-height:1.5"></p>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-p" onclick="replay()">▶ Replay</button><button class="btn btn-g" id="dListBtn">+ List</button><button class="btn btn-g" onclick="share()">↗ Share</button><select id="serverSel" style="height:40px;border-radius:10px;background:#1a1a1a;border:1px solid #252525;color:#f5ebe0;padding:0 8px;font-size:11px"><option value="archive">Archive MP4</option><option value="youtube">YouTube</option></select></div>
      <div id="dCast" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px"></div>
    </div>
    <div>
      <div style="background:#141414;border:1px solid #252525;border-radius:10px;padding:10px"><div style="font-size:10px;color:#8a8a8a;font-weight:700">DETAILS</div><div id="dDetails" style="margin-top:6px;font-size:11px;color:#8a8a8a;line-height:1.6"></div></div>
      <div style="margin-top:10px"><div style="font-size:10px;color:#8a8a8a;font-weight:700;margin-bottom:6px">YOU MAY ALSO LIKE</div><div id="sim" class="track"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const MOVIES=[
  {id:1,title:"Charade",year:1963,rating:8.0,genres:["Comedy","Mystery"],desc:"Audrey Hepburn and Cary Grant in Paris. Romance, murder, mistaken identity. Public domain classic.",dur:"1h 53m",cast:["Cary Grant","Audrey Hepburn"],yt:"C6T2Q4XO7uA",arch:"charade_1963",mp4:"https://archive.org/download/charade_1963/charade_1963_512kb.mp4",views:245000,CA:"#3d2b22",CB:"#1a120f",init:"CH",platform:"Free",legal:1,feat:true},
  {id:2,title:"Night of the Living Dead",year:1968,rating:8.5,genres:["Horror","Classic"],desc:"The dead rise and attack. George Romero's masterpiece that invented modern zombies.",dur:"1h 36m",cast:["Duane Jones"],yt:"yA5kk8LB7BQ",arch:"night_of_the_living_dead",mp4:"https://archive.org/download/night_of_the_living_dead/night_of_the_living_dead_512kb.mp4",views:982340,CA:"#1a1a1a",CB:"#000",init:"NL",platform:"Free",legal:1,feat:true},
  {id:3,title:"The Kid",year:1921,rating:8.2,genres:["Comedy","Classic"],desc:"Charlie Chaplin finds an abandoned baby and raises him as his own.",dur:"1h 08m",cast:["Charlie Chaplin"],yt:"rdICo5GAh5Y",arch:"CharlieChaplin-TheKid",mp4:"https://archive.org/download/CharlieChaplin-TheKid/CharlieChaplin-TheKid_512kb.mp4",views:187000,CA:"#5d4037",CB:"#3d2b22",init:"TK",platform:"Free",legal:1},
  {id:4,title:"His Girl Friday",year:1940,rating:7.9,genres:["Comedy","Classic"],desc:"Fastest talking comedy ever made. Newspaper editor tries to win back ex-wife reporter.",dur:"1h 32m",cast:["Cary Grant"],yt:"-IS-KvD2_Zo",arch:"his_girl_friday",mp4:"https://archive.org/download/his_girl_friday/his_girl_friday_512kb.mp4",views:134000,CA:"#4a3a32",CB:"#2c1e18",init:"HG",platform:"Free",legal:1},
  {id:5,title:"The General",year:1926,rating:8.3,genres:["Comedy","Action"],desc:"Buster Keaton's greatest. Civil War locomotive chase with real trains, no CGI.",dur:"1h 18m",cast:["Buster Keaton"],arch:"TheGeneral1926",mp4:"https://archive.org/download/TheGeneral1926/TheGeneral1926_512kb.mp4",views:210000,CA:"#3d2b22",CB:"#1a120f",init:"TG",platform:"Free",legal:1,feat:true},
  {id:6,title:"Nosferatu",year:1922,rating:8.1,genres:["Horror","Classic"],desc:"First Dracula film. F.W. Murnau's vampire still haunts a century later.",dur:"1h 33m",cast:["Max Schreck"],arch:"nosferatu",mp4:"https://archive.org/download/nosferatu/nosferatu_512kb.mp4",views:298000,CA:"#0a0a0a",CB:"#1a120f",init:"NO",platform:"Free",legal:1},
  {id:7,title:"Metropolis",year:1927,rating:8.3,genres:["Sci-Fi","Classic"],desc:"Fritz Lang's dystopian masterpiece. Workers underground, thinkers above.",dur:"2h 33m",cast:["Brigitte Helm"],arch:"Metropolis1927Restored",mp4:"https://archive.org/download/Metropolis1927Restored/Metropolis1927Restored_512kb.mp4",views:445000,CA:"#1a120f",CB:"#2c1e18",init:"ME",platform:"Free",legal:1},
  {id:8,title:"Steamboat Willie",year:1928,rating:7.8,genres:["Comedy","Classic"],desc:"First 【entity-Mickey Mouse¦canonical_name=Mickey Mouse】. Entered public domain 2024. Changed animation forever.",dur:"0h 08m",cast:["Walt Disney"],arch:"steamboat-willie-1928",mp4:"https://archive.org/download/steamboat-willie-1928/steamboat-willie-1928_512kb.mp4",views:890000,CA:"#0a0a0a",CB:"#1e1e1e",init:"SW",platform:"Free",legal:1},
  {id:9,title:"Sita Sings the Blues",year:2008,rating:7.7,genres:["Comedy","Drama"],desc:"Nina Paley's animated Ramayana set to 1920s jazz. Brilliant and free.",dur:"1h 22m",cast:["Nina Paley"],arch:"SitaSingsTheBlues",mp4:"https://archive.org/download/SitaSingsTheBlues/SitaSingsTheBlues_512kb.mp4",views:123000,CA:"#c19a6b",CB:"#8d6e63",init:"SS",platform:"Free",legal:1},
  {id:10,title:"The Cabinet of Dr. Caligari",year:1920,rating:8.0,genres:["Horror","Classic"],desc:"German Expressionism invented here. Horror cinema begins.",dur:"1h 15m",cast:["Werner Krauss"],arch:"DasCabinetDesDr.Caligari",mp4:"https://archive.org/download/DasCabinetDesDr.Caligari/DasCabinetDesDr.Caligari_512kb.mp4",views:156000,CA:"#1a120f",CB:"#2c1e18",init:"CA",platform:"Free",legal:1},
  {id:11,title:"Gulliver's Travels",year:1939,rating:7.2,genres:["Comedy","Family"],desc:"First Fleischer feature animation. Sailor shipwrecked in Lilliput.",dur:"1h 16m",cast:["Fleischer"],yt:"O55H9tzEdlo",views:98000,CA:"#c19a6b",CB:"#8d6e63",init:"GT",platform:"Free",legal:1},
  {id:12,title:"The Little Shop of Horrors",year:1960,rating:7.1,genres:["Comedy","Horror"],desc:"Seymour's plant thrives on human blood. Young Jack Nicholson cameo.",dur:"1h 12m",cast:["Jonathan Haze"],yt:"dOv_OBYNBVM",views:112000,CA:"#2c1e18",CB:"#1a120f",init:"LS",platform:"Free",legal:1},
  {id:13,title:"The Last Man on Earth",year:1964,rating:7.0,genres:["Horror","Sci-Fi"],desc:"Vincent Price is lone survivor of vampire plague. Basis for I Am Legend.",dur:"1h 26m",cast:["Vincent Price"],yt:"4i7mcozmMZ4",views:156000,CA:"#0f172a",CB:"#1a120f",init:"LM",platform:"Free",legal:1},
  {id:14,title:"Detour",year:1945,rating:7.4,genres:["Noir","Thriller"],desc:"Pianist hitches ride NY to LA, death web. 68-min noir perfection.",dur:"1h 08m",cast:["Tom Neal"],yt:"iYejz2p98o4",views:89000,CA:"#1a120f",CB:"#2a1d17",init:"DE",platform:"Free",legal:1},
  {id:15,title:"The Phantom of the Opera",year:1925,rating:7.6,genres:["Horror","Classic"],desc:"Lon Chaney as phantom in Paris Opera catacombs.",dur:"1h 33m",cast:["Lon Chaney"],yt:"HYvbaILyc2s",views:134500,CA:"#1a120f",CB:"#000",init:"PO",platform:"Free",legal:1},
];
function score(m){const age=2026-m.year;return 0.5*(m.rating/10)+0.3*Math.exp(-0.15*age)+0.2*m.legal}
MOVIES.forEach(m=>m._s=score(m));
let state={q:"",list:JSON.parse(localStorage.getItem('tubemocha_final')||'[]'),cur:null,server:'archive'};
function save(){localStorage.setItem('tubemocha_final',JSON.stringify(state.list));document.getElementById('lc').textContent=state.list.length}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function filt(){let a=[...MOVIES];if(state.q){const q=state.q.toLowerCase();a=a.filter(m=>(m.title+m.desc).toLowerCase().includes(q))}a.sort((x,y)=>y._s-x._s);return a}
function card(m){
return `<div class="card" onclick="openM(${m.id})"><div class="poster"><div class="poster-bg" style="background:linear-gradient(135deg,${m.CA},${m.CB})">${m.init}</div><div style="position:absolute;top:6px;left:6px;z-index:3;display:flex;gap:4px"><span style="padding:2px 5px;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.12);font-size:8px;font-weight:800">${m.year}</span><span style="padding:2px 5px;border-radius:999px;background:#f5ebe0;color:#0a0a0a;font-size:8px;font-weight:800">★ ${m.rating}</span></div><div class="play-ov"><div class="circle">▶</div></div><div style="position:absolute;bottom:5px;left:6px;right:6px;display:flex;justify-content:space-between;z-index:2"><span style="padding:2px 5px;border-radius:999px;background:rgba(193,154,107,.25);color:#c19a6b;font-size:8px;font-weight:800">Free</span><span style="padding:2px 5px;border-radius:999px;background:rgba(0,0,0,.7);font-size:8px">${m.dur}</span></div></div><div class="meta"><div class="t">${m.title}</div><div class="sub"><span>${m.genres[0]}</span><span style="color:${state.list.includes(m.id)?'#c19a6b':''}">${state.list.includes(m.id)?'• List':''}</span></div></div></div>`;
}
function render(){
const all=filt();
const feat=all.find(m=>m.feat)||all[0];
document.getElementById('hero').innerHTML=`
<div class="hero-bg" style="background:linear-gradient(135deg,${feat.CA},${feat.CB})"></div><div class="hero-grad"></div>
<div class="hero-c">
<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px"><span class="pill r">★ ${feat.rating}</span><span class="pill">${feat.year}</span><span class="pill">${feat.dur}</span><span class="pill b">Free</span></div>
<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><div style="width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#8d6e63,#c19a6b);display:grid;place-items:center;font-weight:800;color:#0a0a0a;font-size:11px">T</div><span style="letter-spacing:.14em;font-size:10px;color:#c19a6b;font-weight:700">TUBEMOCHA • FREE CINEMA</span></div>
<h1 style="font-size:28px;line-height:.9;letter-spacing:-.02em;font-weight:800;max-width:520px">${feat.title.toUpperCase()}</h1>
<p style="margin-top:6px;max-width:500px;color:#d1d1d1;font-family:Inter;font-size:12px;line-height:1.4">${feat.desc}</p>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-p" onclick="openM(${feat.id})">▶ Watch Free</button><button class="btn btn-g" onclick="toggle(${feat.id})">${state.list.includes(feat.id)?'✓ List':'+ List'}</button></div>
</div>`;
const rows=document.getElementById('rows');rows.innerHTML='';
const secs=[
{t:"Trending Now",items:all.slice(0,10)},
{t:"Free Classics",items:MOVIES.filter(m=>m.year<1950).slice(0,10)},
{t:"Horror & Thriller",items:MOVIES.filter(m=>m.genres.includes("Horror")).slice(0,10)},
{t:"Comedy",items:MOVIES.filter(m=>m.genres.includes("Comedy")).slice(0,10)},
];
secs.forEach(s=>{
const d=document.createElement('div');d.className='section';d.innerHTML=`<div class="s-head"><div class="s-title">${s.t}</div></div><div class="track">${s.items.map(card).join('')}</div>`;rows.appendChild(d);
});
save();
}
function openM(id){
const m=MOVIES.find(x=>x.id===id);if(!m)return;state.cur=m;
history.pushState({id},'',`?movie=${id}`);
const p=document.getElementById('player');
p.innerHTML=`<div class="poster-play" onclick="createPlayer()"><div class="big-play">▶</div><div style="font-weight:800;font-size:14px">Tap to Play</div><div style="margin-top:4px;font-size:10px;color:#8a8a8a;text-align:center;max-width:300px">${m.title} • ${m.year} • Tap to start with sound</div><div style="margin-top:8px;display:flex;gap:4px"><span class="pill r">★ ${m.rating}</span><span class="pill">${m.year}</span><span class="pill b">Free</span></div></div>`;
document.getElementById('dTitle').textContent=m.title;
document.getElementById('dMeta').innerHTML=`<span class="pill r">★ ${m.rating}</span><span class="pill">${m.year}</span><span class="pill">${m.dur}</span><span class="pill">${m.genres.join(' • ')}</span><span class="pill b">Free</span>`;
document.getElementById('dDesc').textContent=m.desc;
document.getElementById('dCast').innerHTML=m.cast.map(c=>`<span style="padding:4px 7px;border-radius:999px;background:#1a1a1a;border:1px solid #252525;font-size:10px;color:#8a8a8a">${c}</span>`).join('');
document.getElementById('dPlat').textContent=m.platform;
document.getElementById('dDetails').innerHTML=`<div>Year: ${m.year}</div><div>Rating: ★ ${m.rating}</div><div>Duration: ${m.dur}</div><div>Platform: ${m.platform}</div><div>Source: ${m.yt?'YouTube '+m.yt:'Archive '+m.arch}</div>`;
document.getElementById('dListBtn').textContent=state.list.includes(m.id)?'✓ In List':'+ List';
document.getElementById('dListBtn').onclick=()=>{toggle(m.id);document.getElementById('dListBtn').textContent=state.list.includes(m.id)?'✓ In List':'+ List'};
document.getElementById('serverSel').value=state.server;
document.getElementById('serverSel').onchange=(e)=>{state.server=e.target.value; const hasPlayer=document.getElementById('player').querySelector('iframe,video'); if(hasPlayer) createPlayer()};
const sim=MOVIES.filter(x=>x.id!==m.id).map(o=>{const inter=o.genres.filter(g=>m.genres.includes(g)).length;const uni=new Set([...o.genres,...m.genres]).size;return {...o,sim:inter/uni}}).sort((a,b)=>b.sim-a.sim||b._s-a._s).slice(0,8);
document.getElementById('sim').innerHTML=sim.map(card).join('');
document.getElementById('detail').classList.add('open');window.scrollTo(0,0);
}
function createPlayer(){
const m=state.cur;if(!m)return;
const p=document.getElementById('player');
const server=document.getElementById('serverSel').value;
let el;
if(server==='youtube' && m.yt){
el=document.createElement('iframe');
el.src=`https://www.youtube.com/embed/${m.yt}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;
el.allow='autoplay; fullscreen; picture-in-picture';
el.allowFullscreen=true;
}else{
el=document.createElement('video');
el.controls=true; el.playsInline=true; el.autoplay=true; el.preload='metadata';
el.setAttribute('playsinline',''); el.setAttribute('webkit-playsinline','');
const mp4=m.mp4||`https://archive.org/download/${m.arch}/${m.arch}_512kb.mp4`;
el.innerHTML=`<source src="${mp4}" type="video/mp4">`;
el.onerror=()=>{
p.innerHTML=`<iframe src="https://archive.org/embed/${m.arch}?autoplay=1" style="width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
};
}
p.innerHTML=''; p.appendChild(el);
if(el.tagName==='VIDEO'){el.play().catch(()=>{});}
}
function closeD(){document.getElementById('detail').classList.remove('open');document.getElementById('player').innerHTML='';history.pushState({},'','/');render()}
function toggle(id){const i=state.list.indexOf(id);if(i>=0){state.list.splice(i,1);toast('Removed')}else{state.list.push(id);toast('Added to List')}save();render()}
function replay(){createPlayer()}
function share(){navigator.clipboard.writeText(location.href);toast('Link copied')}
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render()});
document.getElementById('listBtn').addEventListener('click',()=>{
if(!state.list.length){toast('List empty');return}
const list=MOVIES.filter(m=>state.list.includes(m.id));
document.getElementById('rows').innerHTML=`<div class="section"><div class="s-head"><div class="s-title">My List • ${list.length}</div><button onclick="render()" style="height:28px;padding:0 12px;border-radius:8px;background:#1a1a1a;border:1px solid #252525;color:#f5ebe0">← Home</button></div><div class="track">${list.map(card).join('')}</div></div>`;
});
